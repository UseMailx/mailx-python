[project]
name = "mailx-sdk"
version = "0.1.1"
description = "Official Python client for the MailX API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/UseMailx/mailx-python"
Repository = "https://github.com/UseMailx/mailx-python"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
